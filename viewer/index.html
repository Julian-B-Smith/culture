<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culture Viewer</title>
<style>
  /* Dev viewer for the canonical C++ core (viewer/README.md). Single dark
     "lab instrument" look, after the v0 prototype. */
  :root {
    color-scheme: dark;
    --ground: #0d0f17; --panel: #151826; --line: #262a3d; --ink: #e6e4ef;
    --muted: #8d8aa3; --signal: #f2b84b; --bad: #ef6f6c;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 13px/1.4 var(--sans);
         display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
           padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .02em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .stat { font-family: var(--mono); color: var(--muted); }
  .stat b { color: var(--ink); font-weight: 500; }
  .stat .live { color: var(--signal); }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; }
  #wrap { position: relative; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border: 1px solid var(--line); }
  #rings { position: absolute; inset: 0; pointer-events: none; image-rendering: auto; border-color: transparent; }
  /* The side panel is a fixed column: controls stay put; the tier list and
     the event log each scroll inside their own box (a long run can hold
     dozens of tiers, and scrolling past them used to scroll the controls
     out of sight). min-height: 0 lets the grid row actually bound it. */
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 12px 14px;
          display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #stage { min-height: 0; }
  .box { border: 1px solid var(--line); border-radius: 6px; background: var(--ground);
         overflow-y: auto; overscroll-behavior: contain; padding: 0 10px; }
  #ledger { flex: 1 1 auto; min-height: 120px; }
  #log { flex: 0 0 auto; height: 140px; padding-top: 6px; padding-bottom: 6px; }
  aside h2 .count { color: var(--ink); font-family: var(--mono); letter-spacing: 0; text-transform: none; margin-left: 6px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .controls label { color: var(--muted); }
  .controls label.check { color: var(--ink); display: flex; gap: 6px; align-items: center; }
  .controls label.check input { width: auto; margin: 0; }
  input, select, button { font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--line);
                          border-radius: 4px; padding: 4px 6px; min-width: 0; }
  button { cursor: pointer; }
  button:hover, select:hover, input:hover { border-color: #3a3f5a; }
  button.primary { background: var(--signal); color: #1a1406; border-color: var(--signal); font-weight: 600; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row > * { flex: 1; }
  .tier:last-child { border-bottom: 0; }
  .tier { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 8px; align-items: center;
          padding: 5px 0; border-bottom: 1px solid var(--line); }
  .tier .sw { width: 12px; height: 12px; border-radius: 3px; }
  .tier .rule { font-family: var(--mono); }
  .tier .meta { grid-column: 2 / -1; color: var(--muted); font-size: 11.5px; }
  .tier .pct { font-family: var(--mono); color: var(--muted); }
  .tier .bar { grid-column: 2 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .tier .bar i { display: block; height: 100%; }
  .tier.dying { opacity: .55; }
  #log { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  #log div { padding: 2px 0; }
  #msg { color: var(--bad); font-family: var(--mono); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  /* Full screen: the stage alone, world as large as it fits; a HUD that
     fades when the mouse is idle. A CSS fallback (.theater) covers browsers
     or frames where the Fullscreen API is refused. */
  #stage:fullscreen, #stage.theater { background: var(--ground); padding: 0; }
  #stage.theater { position: fixed; inset: 0; z-index: 10; }
  #stage:fullscreen canvas, #stage.theater canvas { border-color: transparent; }
  #hud { display: none; position: absolute; top: 14px; left: 16px; right: 16px; justify-content: space-between;
         font-family: var(--mono); color: var(--muted); pointer-events: none; transition: opacity .4s; }
  #hud b { color: var(--ink); font-weight: 500; }
  #stage:fullscreen #hud, #stage.theater #hud { display: flex; }
  #stage.idle #hud { opacity: 0; }
  #stage.idle { cursor: none; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    #ledger { max-height: 50vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Culture <span>· canonical C++ core</span></h1>
  <div class="stat">gen <b id="gen">–</b></div>
  <div class="stat">tiers <b id="ntiers">–</b></div>
  <div class="stat">active <b id="active">–</b></div>
  <div class="stat">surprisal <b id="lastmax">–</b> / record <b id="record">–</b></div>
  <div class="stat" id="status"></div>
  <div class="stat">fps <b id="fps">–</b></div>
  <div class="stat" title="generations per second achieved / target">gens/s <b id="rate">–</b></div>
  <button id="full" title="Full screen (F)">Full screen</button>
  <div id="msg"></div>
</header>
<main id="stage"><div id="wrap"><canvas id="world"></canvas><canvas id="rings"></canvas></div>
  <div id="hud"><span>gen <b id="hgen">–</b> · tiers <b id="htiers">–</b></span><span>F or Esc to exit</span></div></main>
<aside>
  <h2>World</h2>
  <div class="controls">
    <label for="seed">seed</label><input id="seed" type="number" min="0" value="1">
    <label for="size">size</label>
    <select id="size"><option>165x105</option><option selected>220x140</option><option>330x210</option><option>440x280</option><option>550x350</option></select>
    <label for="profile">profile</label>
    <select id="profile"><option value="default">default</option><option value="stress">stress (sparks, mutation)</option></select>
    <label for="spf">speed</label>
    <select id="spf"><option value="1">1× (60 gens/s)</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16× (960 gens/s)</option></select>
    <label for="search">search</label>
    <select id="search"><option value="worker">worker, lands +30 gens</option><option value="sliced">sliced (2 per gen)</option><option value="instant">instant (as goldens)</option></select>
    <label for="view">view</label>
    <select id="view"><option value="life">life</option><option value="territory">territory</option></select>
    <label for="markers">markers</label>
    <label class="check"><input id="markers" type="checkbox" checked> birth rings + search ring (M)</label>
  </div>
  <div class="row"><button class="primary" id="restart">Restart</button><button id="pause">Pause</button></div>
  <div class="row"><button id="sound">Sound: off</button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="volume"></div>
  <div class="hint">Same seed + size + profile + search mode = the same world, every time. Sound is the frozen v0 prototype engine fed by the C++ core (not P3).</div>
  <h2>Tiers<span class="count" id="tcount"></span></h2>
  <div id="ledger" class="box"></div>
  <h2>Events</h2>
  <div id="log" class="box"></div>
</aside>
<script src="/sound.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const FAMILY = ['ash', 'ember', 'gold', 'moss', 'tide', 'violet'];
const HUE = [220, 14, 44, 122, 188, 278];
const KIND = ['surprise', 'spark', 'mutation', 'origin'];

// Colours exactly as the v0 prototype (reference/ui.js colorOf): the hue comes
// from the colour family plus a small per-tier shift keyed by BIRTH ORDER, which
// here is the tier's birth serial (D-031: indices are reused, serials never).
function hsl(h, s, l) {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
const palette = new Map();
function colorOf(serial, el) {
  if (palette.has(serial)) return palette.get(serial);
  const base = el === 0, key = serial;
  const h = (HUE[el] + (key === 0 ? 0 : ((key * 37) % 25) - 12) + 360) % 360;
  const c = { live: hsl(h, base ? 22 : 82, base ? 80 : 58 + (key % 3) * 6),
              dead: hsl(h, base ? 18 : 42, base ? 8 : 10 + (key % 3)),
              css: `hsl(${h.toFixed(0)} ${base ? 22 : 82}% ${base ? 75 : 60}%)` };
  palette.set(serial, c);
  return c;
}
const ruleStr = (b, s) => { let B = '', S = ''; for (let n = 0; n < 9; n++) { if ((b >> n) & 1) B += n; if ((s >> n) & 1) S += n; } return `B${B}/S${S}`; };

// ---- frame parsing (format: viewer/stream.cpp) ----
function parse(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let o = 0;
  const u8 = () => dv.getUint8(o++), u16 = () => { const v = dv.getUint16(o, true); o += 2; return v; };
  const u32 = () => { const v = dv.getUint32(o, true); o += 4; return v; }, f64 = () => { const v = dv.getFloat64(o, true); o += 8; return v; };
  if (u8() !== 67 || u8() !== 70) throw new Error('bad frame magic');
  if (u8() !== 2) throw new Error('frame version mismatch: rebuild culture_stream');
  u8();
  const f = { gen: u32(), W: u16(), H: u16() };
  const nT = u16(), nE = u16();
  f.record = f64(); f.lastMax = f64(); f.retreat = u8(); f.search = u8(); f.active = u16();
  const i32 = () => { const v = dv.getInt32(o, true); o += 4; return v; }, i16 = () => { const v = dv.getInt16(o, true); o += 2; return v; };
  f.frontierAge = i32(); f.warm = f64(); f.lastBirth = i32(); f.meanEpoch = f64(); f.retreatDur = u16();
  f.tiers = [];
  for (let k = 0; k < nT; k++) f.tiers.push({ serial: u32(), idx: u16(), el: u8(), dying: u8() & 1, born: u16(), survive: u16(), cells: u32(), gen: u32(), kind: u8(),
    hash: u32(), from: i16(), mutatedFrom: i16(), pA: i16(), pB: i16(), ox: i16(), oy: i16() });
  const nS = u16();
  const S = { live: new Uint32Array(nS), move: new Uint32Array(nS), fed: new Uint32Array(nS), cos: new Float64Array(nS), sin: new Float64Array(nS),
              cosY: new Float64Array(nS), sinY: new Float64Array(nS), contest: new Float64Array(nS), wall: new Float64Array(nS) };
  for (let k = 0; k < nS; k++) {
    S.live[k] = u32(); S.move[k] = u32(); S.fed[k] = u32();
    S.cos[k] = f64(); S.sin[k] = f64(); S.cosY[k] = f64(); S.sinY[k] = f64(); S.contest[k] = f64(); S.wall[k] = f64();
  }
  f.stats = S;
  f.events = [];
  for (let k = 0; k < nE; k++) f.events.push({ kind: u8(), tier: u16(), x: u16(), y: u16(), gen: u32() });
  f.grid = buf.subarray(o, o + f.W * f.H);
  return f;
}

// ---- drawing ----
const cv = $('world'), ctx = cv.getContext('2d'), rc = $('rings'), rctx = rc.getContext('2d');
let img = null, rings = [], scale = 1, searchAt = null;
// Fill the stage at any (fractional) zoom; `image-rendering: pixelated` keeps
// cells crisp. (Integer-only zoom left a 550x350 world at 1x on a laptop.)
// The ring overlay is drawn at device resolution so rings stay smooth.
function fit(W, H) {
  const stage = $('stage'), pad = isFull() ? 0 : 32;
  scale = Math.min((stage.clientWidth - pad) / W, (stage.clientHeight - pad) / H);
  if (!Number.isFinite(scale) || scale <= 0) scale = 1;
  const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale), dpr = window.devicePixelRatio || 1;
  for (const c of [cv, rc]) { c.style.width = cssW + 'px'; c.style.height = cssH + 'px'; }
  cv.width = W; cv.height = H;
  rc.width = Math.round(cssW * dpr); rc.height = Math.round(cssH * dpr);
  scale = rc.width / W;  // ring coordinates are in overlay pixels
  img = ctx.createImageData(W, H);
}
function draw(f) {
  if (!img || cv.width !== f.W || cv.height !== f.H) fit(f.W, f.H);
  const byIdx = [];
  for (const t of f.tiers) byIdx[t.idx] = colorOf(t.serial, t.el);
  const px = img.data, g = f.grid, life = $('view').value === 'life';
  for (let i = 0, j = 0; i < g.length; i++, j += 4) {
    const c = byIdx[g[i] >> 1] || byIdx[0], col = life ? ((g[i] & 1) ? c.live : c.dead) : c.live;
    px[j] = col[0]; px[j + 1] = col[1]; px[j + 2] = col[2]; px[j + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // Markers, as in the prototype: birth rings expand and fade over ~1.5 s,
  // and a dashed ring marks where a rule search is running. Toggle with M.
  rctx.clearRect(0, 0, rc.width, rc.height);
  rings = rings.filter(r => (r.age += 1) < 90);
  if (!$('markers').checked) return;
  if (f.search && searchAt) {
    rctx.setLineDash([4 * (scale / 3 + 1), 4 * (scale / 3 + 1)]); rctx.strokeStyle = 'rgba(242,184,75,.85)'; rctx.lineWidth = 1.5;
    rctx.beginPath(); rctx.arc((searchAt.x + .5) * scale, (searchAt.y + .5) * scale, 9 * scale, 0, 2 * Math.PI); rctx.stroke();
    rctx.setLineDash([]);
  }
  for (const r of rings) {
    rctx.strokeStyle = r.css; rctx.globalAlpha = 1 - r.age / 90; rctx.lineWidth = 2;
    rctx.beginPath(); rctx.arc((r.x + .5) * scale, (r.y + .5) * scale, (6 + r.age * .3) * scale, 0, 2 * Math.PI); rctx.stroke();
  }
  rctx.globalAlpha = 1;
}

// ---- side panel ----
let lastLedger = 0;
function ledger(f) {
  const n = f.W * f.H, rows = [];
  for (const t of f.tiers) {
    const c = colorOf(t.serial, t.el), pct = 100 * t.cells / n;
    rows.push(`<div class="tier${t.dying ? ' dying' : ''}"><div class="sw" style="background:${c.css}"></div>` +
      `<div class="rule">${t.idx} · ${ruleStr(t.born, t.survive)}</div><div class="pct">${pct.toFixed(1)}%</div>` +
      `<div class="meta">${FAMILY[t.el]} · ${KIND[t.kind]}${t.idx ? ' · born gen ' + t.gen.toLocaleString() : ''}${t.dying ? ' · retreating' : ''}</div>` +
      `<div class="bar"><i style="width:${Math.min(100, pct)}%;background:${c.css}"></i></div></div>`);
  }
  // Rebuilding the list resets nothing the reader cares about: keep the
  // box's scroll position across updates.
  const box = $('ledger'), top = box.scrollTop;
  box.innerHTML = rows.join('');
  box.scrollTop = top;
  $('tcount').textContent = `${f.tiers.length}`;
}
const logLines = [];
function events(f) {
  for (const e of f.events) {
    if (e.kind === 0) { searchAt = { x: e.x, y: e.y }; continue; }
    const t = f.tiers.find(t => t.idx === e.tier);
    if (e.kind === 1 && t) {
      const c = colorOf(t.serial, t.el);
      rings.push({ x: e.x, y: e.y, age: 0, css: c.css });
      logLines.unshift(`${e.gen.toLocaleString()}  birth #${e.tier} ${ruleStr(t.born, t.survive)} (${KIND[t.kind]})`);
    } else if (e.kind === 2) logLines.unshift(`${e.gen.toLocaleString()}  tier ${e.tier} dying`);
    else if (e.kind === 3) logLines.unshift(`${e.gen.toLocaleString()}  tier ${e.tier} extinct`);
  }
  logLines.length = Math.min(logLines.length, 14);
  $('log').innerHTML = logLines.map(l => `<div>${l}</div>`).join('') || '<div>—</div>';
}
function header(f) {
  $('gen').textContent = f.gen.toLocaleString();
  $('ntiers').textContent = f.tiers.length;
  $('active').textContent = f.active;
  $('lastmax').textContent = f.lastMax.toFixed(1);
  $('record').textContent = f.record.toFixed(1);
  $('hgen').textContent = f.gen.toLocaleString();
  $('htiers').textContent = f.tiers.length;
  $('status').innerHTML = f.retreat ? '<b class="live">retreat</b>' : f.search ? '<b class="live">searching…</b>' : '';
}

// ---- sound: the frozen v0 engine (reference/sound.js) driven by C++ frames ----
// Sonic keys voices and its pitch walk by tier OBJECT identity, so each tier
// gets one stable object (by birth serial) updated in place every frame.
// Tiers that leave the frame move to an extinct list, which the pitch walk
// searches for dead parents. Parameters mirror defaultParams()/stressParams().
const sonic = new Sonic.Engine();
let soundOn = false;
const shims = new Map();
let extinctShims = [];
function soundWorld(f) {
  const tiers = [], seen = new Set();
  for (const t of f.tiers) {
    let T = shims.get(t.serial);
    if (!T) { T = {}; shims.set(t.serial, T); }
    T.idx = t.idx; T.el = t.el; T.cells = t.cells; T.dying = !!t.dying; T.hash = t.hash;
    T.rule = T.rule || { born: t.born, survive: t.survive };
    T.from = t.from < 0 ? undefined : t.from;
    T.mutatedFrom = t.mutatedFrom < 0 ? null : t.mutatedFrom;
    T.parents = t.pA < 0 ? null : [t.pA, t.pB];
    T.origin = t.ox < 0 ? null : [t.ox, t.oy];
    tiers[t.idx] = T; seen.add(t.serial);
  }
  for (const [serial, T] of shims) if (!seen.has(serial)) { extinctShims.push(T); shims.delete(serial); }
  if (extinctShims.length > 500) extinctShims = extinctShims.slice(-500);
  return { W: f.W, H: f.H, gen: f.gen, tiers, extinct: extinctShims, stats: f.stats,
           retreat: f.retreat ? { dur: f.retreatDur } : null, search: !!f.search, record: f.record, lastMax: f.lastMax,
           frontierAge: f.frontierAge, warm: f.warm, lastBirth: f.lastBirth, meanEpoch: f.meanEpoch };
}
const soundParams = () => ({ speed: Number($('spf').value), hardness: 3, margin: 0.04, warmup: 300 });
function soundFrame(f) {
  const world = soundWorld(f);
  if (!soundOn) return world;
  for (const e of f.events) {
    if (e.kind === 1) sonic.event({ tier: e.tier }, world, soundParams());
    else if (e.kind === 2) sonic.event({ dying: e.tier }, world, soundParams());
  }
  return world;
}
function resetSound() { sonic.reset(); shims.clear(); extinctShims = []; }
$('sound').addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn) { sonic.start(); sonic.setVolume(Number($('volume').value)); } else sonic.stop();
  $('sound').textContent = soundOn ? 'Sound: on' : 'Sound: off';
});
$('volume').addEventListener('input', () => sonic.setVolume(Number($('volume').value)));

// ---- streaming ----
let controller = null, paused = false, frames = 0, fpsT = performance.now(), streamId = null, rateGen = null;
async function start() {
  if (controller) controller.abort();
  controller = new AbortController();
  palette.clear(); rings = []; logLines.length = 0; img = null; $('msg').textContent = '';
  resetSound(); rateGen = null; searchAt = null;
  const q = new URLSearchParams({ seed: $('seed').value || '1', size: $('size').value, profile: $('profile').value,
                                  spf: $('spf').value, search: $('search').value, fps: '60' });
  let res;
  try { res = await fetch('/stream?' + q, { signal: controller.signal }); }
  catch (e) { if (e.name !== 'AbortError') $('msg').textContent = 'stream failed: ' + e.message; return; }
  if (!res.ok) { $('msg').textContent = await res.text(); return; }
  streamId = res.headers.get('x-stream-id');
  if (paused) { paused = false; $('pause').textContent = 'Pause'; }
  const reader = res.body.getReader();
  let buf = new Uint8Array(0);
  const mine = controller;
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done || mine !== controller) break;
      const nb = new Uint8Array(buf.length + value.length); nb.set(buf); nb.set(value, buf.length); buf = nb;
      let latest = null;
      while (buf.length >= 4) {
        const len = new DataView(buf.buffer, buf.byteOffset).getUint32(0, true);
        if (buf.length < 4 + len) break;
        const f = parse(buf.subarray(4, 4 + len));
        events(f);           // never drop events, even when frames are skipped
        f.soundWorld = soundFrame(f);
        latest = f;
        buf = buf.slice(4 + len);
      }
      if (latest) {
        draw(latest); header(latest);
        if (soundOn) sonic.update(latest.soundWorld, soundParams());  // self-throttles to ~15 Hz
        const now = performance.now();
        if (now - lastLedger > 250) { ledger(latest); lastLedger = now; }
        frames++;
        if (now - fpsT > 1000) {
          $('fps').textContent = (frames * 1000 / (now - fpsT)).toFixed(0);
          // Achieved vs target generation rate: makes lag visible and attributable.
          if (rateGen !== null) $('rate').textContent = `${Math.round((latest.gen - rateGen) * 1000 / (now - fpsT))} / ${Number($('spf').value) * 60}`;
          rateGen = latest.gen; frames = 0; fpsT = now;
        }
      }
    }
  } catch (e) { if (e.name !== 'AbortError') $('msg').textContent = 'stream error: ' + e.message; }
}
$('restart').addEventListener('click', start);
for (const id of ['size', 'profile', 'search', 'spf']) $(id).addEventListener('change', start);
$('seed').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
// Pause stops the simulation process itself (server SIGSTOP), so resuming
// continues from exactly where it stopped, with no backlog.
$('pause').addEventListener('click', async () => {
  if (!streamId) return;
  paused = !paused;
  $('pause').textContent = paused ? 'Resume' : 'Pause';
  if (soundOn) paused ? sonic.stop() : sonic.start();
  await fetch(`/control?id=${streamId}&op=${paused ? 'pause' : 'resume'}`, { method: 'POST' });
});
// ---- full screen ----
const stage = $('stage');
function isFull() { return document.fullscreenElement === stage || stage.classList.contains('theater'); }
async function toggleFull() {
  if (isFull()) {
    if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
    stage.classList.remove('theater');
  } else {
    // Some hosts (embedded panes, iframes) accept the request and then drop
    // full screen at once, or refuse it outright. Either way, fall back to the
    // in-page "theater" mode so the button always does something visible.
    // A request can also hang without settling (seen in the Claude browser
    // pane), so check the effective state after 400 ms instead of trusting
    // the promise.
    enteredAt = performance.now();
    stage.requestFullscreen().catch(() => stage.classList.add('theater'));
    setTimeout(() => { if (document.fullscreenElement !== stage) { stage.classList.add('theater'); img = null; } }, 400);
  }
  img = null;
}
let enteredAt = 0;
$('full').addEventListener('click', toggleFull);
document.addEventListener('keydown', e => {
  // Typing into a field must not trigger shortcuts. (The target can be the
  // document itself, which has no .matches, so check it is an Element.)
  if (e.target instanceof Element && e.target.matches('input:not([type=checkbox]), select')) return;
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'Escape' && stage.classList.contains('theater')) toggleFull();
  else if (e.key === ' ') { e.preventDefault(); $('pause').click(); }
  else if (e.key === 'm' || e.key === 'M') { $('markers').checked = !$('markers').checked; }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && performance.now() - enteredAt < 500) stage.classList.add('theater');
  img = null;
});
let idleTimer = null;
stage.addEventListener('mousemove', () => {
  stage.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (isFull()) stage.classList.add('idle'); }, 2000);
});
new ResizeObserver(() => { img = null; }).observe(stage);
start();
</script>
</body>
